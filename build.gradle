plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.hermes'
version = '0.0.1-SNAPSHOT'

// Spring Boot 3.2.5 manages 3.13.0, which is affected by CVE-2025-48924.
ext['commons-lang3.version'] = '3.18.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    integrationTestImplementation.extendsFrom testImplementation
    integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    
    // Swagger UI & OpenAPI 3 (For Postman Import)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    
    // Hibernate 6 JSONB type support
    implementation 'org.hibernate.orm:hibernate-core'

    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Spring Cache & Caffeine for MarketTimeValidator caching
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    
    // Resilience4j for KIS API RateLimiting & Retry
    implementation 'io.github.resilience4j:resilience4j-spring-boot3:2.2.0'
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

sourceSets {
    integrationTest {
        java.srcDir file('src/integrationTest/java')
        resources.srcDir file('src/integrationTest/resources')
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.register('integrationTest', Test) {
    description = 'Runs integration tests against the Docker PostgreSQL database.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    useJUnitPlatform()
    shouldRunAfter tasks.named('test')

    def localDbUrl = System.getenv('LOCAL_DB_URL')
            ?: 'jdbc:postgresql://localhost:55432/hermes_local'
    def localDbUsername = System.getenv('LOCAL_DB_USERNAME') ?: 'hermes'
    def localDbPassword = System.getenv('LOCAL_DB_PASSWORD') ?: 'hermes_local_password'
    environment 'LOCAL_DB_URL', localDbUrl
    environment 'LOCAL_DB_USERNAME', localDbUsername
    environment 'LOCAL_DB_PASSWORD', localDbPassword
    environment 'DB_URL', System.getenv('DB_URL') ?: localDbUrl
    environment 'DB_USERNAME', System.getenv('DB_USERNAME') ?: localDbUsername
    environment 'DB_PASSWORD', System.getenv('DB_PASSWORD') ?: localDbPassword
    environment 'KIS_MOCK_APP_KEY',
            System.getenv('KIS_MOCK_APP_KEY') ?: 'local-integration-app-key'
    environment 'KIS_MOCK_APP_SECRET',
            System.getenv('KIS_MOCK_APP_SECRET') ?: 'local-integration-app-secret'
    environment 'KIS_MOCK_ACCOUNT_NO',
            System.getenv('KIS_MOCK_ACCOUNT_NO') ?: '00000000-01'
}
