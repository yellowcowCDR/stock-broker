services:
  postgres:
    image: postgres:15
    container_name: hermes-postgres-local
    ports:
      - "${LOCAL_POSTGRES_PORT:-55432}:5432"
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-hermes_local}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-hermes}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:-hermes_local_password}
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

volumes:
  postgres-local-data:
